[package]
name = "alpha-sentinel-guardrail-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
description = "Bounded deterministic request guardrail prototype for Alpha Sentinel"

[dependencies]
axum = { version = "0.7", features = ["json"] }
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.5", features = ["limit", "timeout", "trace"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
