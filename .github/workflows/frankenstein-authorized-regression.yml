name: Frankenstein authorized agent regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/frankenstein-authorized/**'
      - '.github/workflows/frankenstein-authorized-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile exact checkout
        run: python -m compileall -q experiments/frankenstein-authorized
      - name: Run isolated stdlib regression tests
        working-directory: experiments/frankenstein-authorized
        run: python -m unittest discover -s tests -v
