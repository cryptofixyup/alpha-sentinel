name: ML Pipeline CI

on:
  push:
    branches: [main, 'agent/**', 'hardened/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PyTorch CPU build
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify no tracked environment secret
        shell: bash
        run: |
          if git ls-files | grep -E '^\.env$'; then
            echo 'ERROR: .env must never be tracked.'
            exit 1
          fi

      - name: Run Python tests
        run: python -m pytest tests/ -v

      - name: Run security-boundary tests
        run: node --test tests/security-boundary.test.js

      - name: Run persistent lifecycle tests
        run: node --test tests/persistent-lifecycle.test.js

      - name: Run lightweight benchmark smoke test
        run: python benchmark_mobile.py --iterations 5
