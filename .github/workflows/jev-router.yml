name: JEV router recovery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Record tested revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD
          python --version
      - name: Verify recovered source hashes
        working-directory: experiments/jev-router
        run: sha256sum --check SOURCE.sha256
      - name: Run recovered offline tests
        run: python -m unittest discover -s experiments/jev-router -p 'test_*.py' -v
      - name: Compile recovered Python files
        run: python -m compileall -q experiments/jev-router
