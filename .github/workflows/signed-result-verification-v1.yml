name: Signed Result Verification v1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  signed-result-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/signed-result-verification-v1.test.js
