name: Guardrail Proxy CI

on:
  pull_request:
    paths:
      - "guardrail-proxy/**"
      - ".github/workflows/guardrail-proxy.yml"
  push:
    branches: [main, "feat/rust-guardrail-proxy"]
    paths:
      - "guardrail-proxy/**"
      - ".github/workflows/guardrail-proxy.yml"

permissions:
  contents: read

concurrency:
  group: guardrail-proxy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust unit and compile checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guardrail-proxy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: guardrail-proxy -> target
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Unit and binary tests (exclude DB integration tests)
        run: cargo test --lib --bins
      - name: Documentation tests
        run: cargo test --doc
      - name: Compile release binary
        run: cargo build --release

  http-regression:
    name: HTTP regression harness
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit_test -d audit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://audit_test@localhost:5432/audit_test
      TEST_DATABASE_URL: postgres://audit_test@localhost:5432/audit_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Apply schema and exercise PostgreSQL sink
        run: cargo test --manifest-path guardrail-proxy/Cargo.toml --test audit_sink_integration -- --test-threads=1
      - name: Build service
        run: cargo build --manifest-path guardrail-proxy/Cargo.toml
      - name: Start service and run regression harness
        shell: bash
        run: |
          set -euo pipefail
          ./guardrail-proxy/target/debug/alpha-sentinel-guardrail-proxy > /tmp/guardrail-proxy.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8080/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/guardrail-proxy.log
            echo "Service failed to become ready" >&2
            exit 1
          fi
          python guardrail-proxy/tests/fuzz_harness.py
