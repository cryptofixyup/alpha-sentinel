name: security-boundary

on:
  push:
    branches: [main, hardened-transaction-boundary]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Compile boundary package
        run: python -m compileall -q security_boundary
      - name: Run security invariants
        run: python -m pytest -q tests/test_security_boundary.py
