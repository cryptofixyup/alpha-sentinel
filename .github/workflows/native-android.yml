name: Native Android Baseline

on:
  push:
    branches: [feat/native-android-evidence]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Gradle configuration
        run: ./gradlew --version

      - name: Assemble debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace
