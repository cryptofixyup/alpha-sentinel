name: Hardening release gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [hardening/integrated-risk-release-gates]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile security boundary
        run: python -m compileall -q security_boundary
      - name: Test execution controls
        run: python -m pytest -q tests/test_execution_controls.py
      - name: Test existing security boundary
        run: python -m pytest -q tests/test_security_boundary.py
      - name: Preserve release decision
        if: always()
        run: |
          {
            echo "# Hardening release gate"
            echo
            echo "- Revision: `$GITHUB_SHA`"
            echo "- Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Live trading: **BLOCKED** until end-to-end gate integration and all CI checks are verified."
          } >> "$GITHUB_STEP_SUMMARY"
