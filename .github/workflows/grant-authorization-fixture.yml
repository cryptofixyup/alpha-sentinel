name: Grant Authorization Fixture

on:
  pull_request:
    paths:
      - 'tests/test_grant_authorization_fixture.py'
      - 'security_boundary/**'
      - '.github/workflows/grant-authorization-fixture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run bounded authorization regressions
        run: python -m pytest -q tests/test_grant_authorization_fixture.py
