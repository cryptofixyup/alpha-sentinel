name: Coverage v1

on:
  push:
    branches: [main, "skunkworks/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run coverage harness
        run: node --test tests/coverage-v1.test.js tests/generated/coverage-*.test.js
