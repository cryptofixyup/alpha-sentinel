name: Coverage v1

on:
  push:
    branches: [main, "skunkworks/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'
      - name: Record tested revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p evidence/top-level evidence/recursive
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node -e 'const fs=require("node:fs"); const cp=require("node:child_process"); fs.writeFileSync("evidence/identity.json", JSON.stringify({testedSha:cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),eventSha:process.env.GITHUB_SHA,workflowSha:process.env.GITHUB_WORKFLOW_SHA,workflowRef:process.env.GITHUB_WORKFLOW_REF,prHeadSha:process.env.PR_HEAD_SHA||null,node:process.version,runUrl:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`},null,2)+"\n")'
      - name: Run all top-level tests with coverage
        env:
          ES001_EVIDENCE_DIR: ${{ github.workspace }}/evidence/top-level
        run: |
          set -o pipefail
          node --test --experimental-test-coverage tests/*.test.js 2>&1 | tee evidence/top-level.log
      - name: Run recursive suite including generated tests
        env:
          ES001_EVIDENCE_DIR: ${{ github.workspace }}/evidence/recursive
        run: |
          set -o pipefail
          node --test 2>&1 | tee evidence/recursive.log
      - name: Hash test sources and retained evidence
        if: always()
        run: |
          mkdir -p evidence
          sha256sum tests/es001-peer-authority.test.js tests/coverage-router-journal.test.js tests/result-claim-reservation.test.js security/signed-result-verifier.js .github/workflows/coverage-v1.yml > evidence/source.sha256
          find evidence -type f ! -name MANIFEST.sha256 ! -name MANIFEST.anchor -print0 | sort -z | xargs -0 sha256sum > evidence/MANIFEST.sha256
          sha256sum evidence/MANIFEST.sha256 > evidence/MANIFEST.anchor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorization-test-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/
          if-no-files-found: error
